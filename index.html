<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crundel Craft & Market Hub</title>
    <style>
        :root {
            --bg-main: #0d1322;
            --card-bg: #151d30;
            --border-color: #2a3650;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --input-bg: #0f172a;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .title-area h1 {
            color: #fff;
            font-size: 22px;
            margin: 0 0 5px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .title-area p {
            color: var(--text-muted);
            font-size: 13px;
            margin: 0;
        }
        .badge {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid rgba(52, 211, 153, 0.3);
        }
        .panel {
            background: rgba(15, 23, 42, 0.6);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select, input {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background: var(--input-bg);
            color: #fff;
        }
        select:focus, input:focus {
            outline: none;
            border-color: var(--accent);
        }
        button {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0f172a;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            grid-column: 1 / -1;
            transition: transform 0.1s, filter 0.2s;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        button:hover {
            filter: brightness(1.1);
        }
        button:active {
            transform: scale(0.99);
        }
        .recommendation-box {
            background: rgba(245, 158, 11, 0.1);
            border: 1px dashed var(--accent);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 15px;
            color: var(--accent);
            text-align: center;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: var(--input-bg);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            border-bottom: 1px solid var(--border-color);
            padding: 14px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background-color: #1e293b;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
        }
        tr:hover {
            background-color: rgba(255,255,255,0.02);
        }
        .market-rank {
            font-size: 12px;
            line-height: 1.5;
            text-align: left;
            padding-left: 15px;
        }
        .total-box {
            margin-top: 25px;
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            color: var(--accent);
            background: var(--input-bg);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .loading {
            text-align: center;
            font-style: italic;
            color: var(--accent);
            margin: 15px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title-area">
            <h1>📦 Crundel Craft & Market Hub</h1>
            <p>Americas Server • Live API & Crafting Calculator</p>
        </div>
        <div class="badge">🟢 Server : Americas (Global)</div>
    </div>

    <div class="panel">
        <div class="form-group">
            <label for="categorySelect">Category:</label>
            <select id="categorySelect" onchange="updateItemList()">
                <option value="cloth">Cloth / Fibers (Refining)</option>
                <option value="metal">Metal / Ores (Refining)</option>
                <option value="leather">Leather / Hides (Refining)</option>
                <option value="wood">Wood / Planks (Refining)</option>
                <option value="stone">Stone / Blocks (Refining)</option>
                <option value="fishing">Fishing Rods (Crafting)</option>
                <option value="kingmaker">Kingmaker Swords (Crafting)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="itemSelect">Item / Tier:</label>
            <select id="itemSelect" onchange="updateRecommendation()"></select>
        </div>
        <div class="form-group">
            <label for="enchantSelect">Enchantment:</label>
            <select id="enchantSelect">

                <option value="1">.1 (Uncommon)</option>
